name: CI - Build & Verify

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build, Static Analysis & Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Grant execute permission for mvnw
        run: chmod +x mvnw

      - name: Compile and Run Tests (Unit & Integration via Testcontainers)
        run: ./mvnw clean verify -B
        env:
          # Garante que o Testcontainers utilize o daemon do docker do runner
          TESTCONTAINERS_RYUK_DISABLED: "false"

      - name: Publish Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 5